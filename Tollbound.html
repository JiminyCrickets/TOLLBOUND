<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tollbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky ledger header over one column. Battle = three lanes (allies | clash table | enemies) above a planning tray.
   Single committed dark world: a tarred pier at night, lit by brass coin and lantern. */
:root{
  color-scheme: dark;
  --ink:#141116; --panel:#1d191f; --panel-2:#272128; --line:#3b3239; --line-2:#52454d;
  --fg:#ece4d7; --muted:#a69a8d; --dim:#6f655f;
  --brass:#d6a64f; --brass-hi:#f1cf86; --brass-deep:#7f5d22;
  --blood:#cf4a3f; --tide:#4fa8a2; --ember:#e3813a; --frost:#93acd9; --focus:#d9cf72; --bind:#a98bd0; --ok:#86b86f;
  --rot:#98b250; --frag:#e8a3a0; --weak-c:#c9a184; --ratt:#dcc47f; --hex:#bd84de;
  --c-vesna:#d6584b; --c-oren:#7c9ac4; --c-mireille:#cbbf55; --c-tamsin:#e3813a; --c-enemy:#8e7f86;
  --on-brass:#1b140a; --shadow:#000;
  --f-display:"Big Shoulders Display","Oswald",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 520px at 75% -120px,#2c1f1b 0,transparent 70%),var(--ink);background-color:var(--ink);color:var(--fg);font:15px/1.45 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.muted{color:var(--muted)} .sm{font-size:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,17,22,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;letter-spacing:.09em;text-transform:uppercase;color:var(--brass)}
.brand small{display:block;margin-top:3px;font:400 10px var(--f-mono);letter-spacing:.2em;color:var(--muted)}
nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:2px}
nav button{background:none;border:0;padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
nav button:hover:not(:disabled){color:var(--fg)}
nav button.on{background:var(--panel-2);color:var(--brass)}
nav button:disabled{cursor:not-allowed;opacity:.45}
.tokens{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tok{font:12px var(--f-mono);padding:3px 9px;border:1px solid var(--line);border-radius:999px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.tok i{width:8px;height:8px;border-radius:50%;background:var(--hue)}
.tok b{color:var(--fg);font-weight:600}

/* buttons */
.btn{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--brass);color:var(--on-brass);border:1px solid var(--brass);border-radius:4px;padding:9px 14px;cursor:pointer;transition:filter .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:var(--panel-2);border-color:var(--line);color:var(--dim);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-2)}
.btn.ghost:disabled{background:transparent;color:var(--dim);border-color:var(--line)}
.btn.danger{color:var(--blood);border-color:rgba(207,74,63,.5)}
.btn.big{font-size:15px;padding:12px 22px}
.btn.sm{font-size:11px;padding:6px 10px}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}
.linkbtn:hover{color:var(--blood)}

/* type */
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:0}
h1,.h-sec{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.95;margin:6px 0 10px;text-wrap:balance}
h1{font-size:clamp(36px,5.4vw,60px)}
.h-sec{font-size:clamp(30px,4vw,44px)}
.h-sub{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:24px;margin:0;letter-spacing:.02em}
.lede{color:var(--muted);max-width:62ch;margin:0}
.sec-head{padding-block:26px 16px}

/* contracts */
.intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;padding-block:30px 18px;align-items:start}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.howto summary{cursor:pointer;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--brass)}
.howto ol{margin:10px 0 2px;padding-left:20px;display:grid;gap:7px;color:var(--muted);font-size:14px}
.howto b{color:var(--fg)}
.teambar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.teambar .lbl{font:600 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line-2);border-radius:999px;font-weight:600;font-size:13px}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--hue);transform:rotate(45deg)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.ticket{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;left:53px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.t-stub{border-right:2px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 4px;background:var(--panel-2)}
.t-no{font:600 11px var(--f-mono);writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.22em;color:var(--brass)}
.t-rew{text-align:center;font:10px var(--f-mono);color:var(--muted);letter-spacing:.1em}
.t-rew b{display:block;font-family:var(--f-display);font-size:28px;color:var(--fg);line-height:1}
.t-body{padding:14px 16px;display:grid;gap:8px;align-content:start}
.t-body h3{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;margin:0;line-height:1;padding-right:56px}
.t-body p{margin:0;color:var(--muted);font-size:14px}
.t-foes{font-size:13px!important;color:var(--fg)!important}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.t-foot span{font:11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.ticket.locked{opacity:.5}
.ticket.night{background:linear-gradient(180deg,#1e1a2a,var(--panel));border-color:#3d3654}
.stamp{position:absolute;right:12px;top:12px;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--blood);border:2px solid var(--blood);padding:1px 8px;transform:rotate(-9deg);opacity:.85;letter-spacing:.12em;border-radius:3px}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.rcard.on{border-color:var(--hue)}
.rcard header{display:flex;gap:12px;align-items:center}
.sigil{width:30px;height:30px;flex:none;border:2px solid var(--hue);transform:rotate(45deg);border-radius:3px;background:rgba(0,0,0,.25)}
.rcard.on .sigil{background:var(--hue)}
.rcard h3{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase;line-height:1}
.role{margin:2px 0 0;color:var(--muted);font-size:13px}
.tokbig{margin-left:auto;text-align:right;font:10px var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tokbig b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;color:var(--brass)}
.rcard>p{margin:0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0}
.stats div{background:var(--panel-2);border-radius:4px;padding:6px 8px}
.stats dt{font:10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.weak{color:var(--blood)} .tough{color:var(--tide)}
.mini-skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.danger-zone{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* skill card */
.skill{display:grid;gap:3px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 10px;color:var(--fg);min-width:0;position:relative}
button.skill{cursor:pointer;transition:border-color .15s,background .15s}
button.skill:hover{border-color:var(--line-2);background:#2d262e}
.skill.picked{border-color:var(--brass);background:#30271d;box-shadow:inset 0 0 0 1px var(--brass)}
.sk-head{display:flex;justify-content:space-between;gap:6px;font:600 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.t-slash .sk-type,.cs-skill.t-slash{color:var(--blood)} .t-pierce .sk-type,.cs-skill.t-pierce{color:var(--focus)} .t-blunt .sk-type,.cs-skill.t-blunt{color:var(--frost)} .t-guard .sk-type,.cs-skill.t-guard{color:var(--tide)}
.sk-name{display:block;font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.sk-pow{display:flex;align-items:center;gap:5px;font:600 12px var(--f-mono)}
.sk-pow b{font-family:var(--f-display);font-size:22px;line-height:1}
.sk-pow .coin{width:11px;height:11px;border-width:1.5px;margin:0}
.sk-pow .coins{display:inline-flex;gap:2px}
.sk-fx{display:grid;gap:1px;font-size:12px;color:var(--muted);line-height:1.3}
.sk-fx span{display:block}
.sk-fx b{color:var(--fg);font-weight:600}
.skill.big{padding:14px 16px}
.skill.big .sk-name{font-size:20px}
.skill.big .sk-pow b{font-size:34px}
.skill.big .sk-pow .coin{width:16px;height:16px;border-width:2px}
.skill.big .sk-fx{font-size:13px}
.skill.mini{padding:6px 8px}
.skill.mini .sk-name{font-size:13px}
.skill.mini .sk-pow b{font-size:18px}

/* coins */
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid var(--brass);background:transparent;vertical-align:middle}
.coin.heads{background:radial-gradient(circle at 35% 32%,var(--brass-hi),var(--brass) 55%,var(--brass-deep));border-color:var(--brass-hi);box-shadow:0 0 10px rgba(214,166,79,.45)}
.coin.tails{background:var(--panel);border-color:var(--brass-deep)}
.coin.broken{border-style:dashed;border-color:var(--dim);opacity:.45;transform:scale(.78)}
.coin.flip{animation:flip .42s ease-out}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}45%{transform:rotateY(540deg) translateY(-12px)}100%{transform:rotateY(1080deg) translateY(0)}}

/* battle */
.battle{padding-block:14px 0}
.bhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.bhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,36px);margin:2px 0 0;text-transform:uppercase;line-height:1}
.bctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.speedctl{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.speedctl button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 10px;font:600 12px var(--f-mono);color:var(--muted);cursor:pointer}
.speedctl button:last-child{border-right:0}
.speedctl button.on{background:var(--panel-2);color:var(--brass)}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"allies stage enemies";gap:14px;align-items:start}
#allies{grid-area:allies} #stage{grid-area:stage} #enemies{grid-area:enemies}
@media (max-width:920px){
  .field{grid-template-columns:minmax(0,1fr);grid-template-areas:"enemies" "stage" "allies"}
  .side{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
  .stage{min-height:170px}
  .stage-idle .big{font-size:42px}
}
.side{display:grid;gap:10px;min-width:0}
.side-lbl{font:600 10px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);grid-column:1/-1;margin:0}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;position:relative;min-width:0;transition:border-color .15s,transform .15s,opacity .3s}
.unit .uhead{display:flex;align-items:center;gap:8px}
.unit .uname{font-weight:700;font-size:15px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.unit .glyph{width:10px;height:10px;flex:none;background:var(--hue);transform:rotate(45deg);border-radius:2px}
.dice{margin-left:auto;display:flex;gap:4px}
.die{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:4px;background:var(--fg);color:var(--ink);font:700 13px var(--f-mono)}
.die.done{background:var(--panel-2);color:var(--dim)}
.hp{position:relative;height:9px;background:var(--panel-2);border-radius:2px;overflow:visible}
.hp .fill{position:absolute;inset:0 auto 0 0;background:var(--hue);border-radius:2px;transition:width .35s ease}
.hp .shieldfill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,var(--tide) 0 3px,transparent 3px 6px);opacity:.8;border-radius:2px}
.hp .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brass);transform:translateX(-1px)}
.hp .tick.spent{background:var(--dim)}
.ustats{display:flex;flex-wrap:wrap;gap:4px 10px;font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ustats b{color:var(--fg);font-weight:600}
.sp-pos{color:var(--tide)!important} .sp-neg{color:var(--blood)!important}
.statuses{display:flex;flex-wrap:wrap;gap:4px}
.st{font:600 11px var(--f-mono);padding:1px 6px;border-radius:3px;border:1px solid currentColor;cursor:help}
.st-bleed{color:var(--blood)} .st-burn{color:var(--ember)} .st-shatter{color:var(--frost)} .st-focus{color:var(--focus)} .st-might{color:var(--brass)} .st-haste{color:var(--ok)} .st-bind{color:var(--bind)} .st-shield{color:var(--tide)}
.st-rot{color:var(--rot)} .st-fragile{color:var(--frag)} .st-weaken{color:var(--weak-c)} .st-rattle{color:var(--ratt)} .st-jinx{color:var(--hex)}
.badge{position:absolute;top:-9px;right:10px;font:700 10px var(--f-mono);letter-spacing:.14em;padding:2px 6px;border-radius:3px;background:var(--frost);color:var(--ink)}
.unit.stag{border-color:var(--frost)}
.unit.dead{opacity:.32;filter:grayscale(1)}
.unit.dead .badge{background:var(--dim)}
.unit.targetable{cursor:pointer;border-color:var(--line-2)}
.unit.targetable:hover{border-color:var(--brass);transform:translateY(-2px)}
.unit.aimed{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.res{display:flex;gap:8px;font:11px var(--f-mono);color:var(--muted)}
.intents{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.intent{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.25;min-width:0}
.intent .die{min-width:20px;height:20px;font-size:11px}
.intent .what{min-width:0;overflow-wrap:anywhere}
.intent .rng{font:11px var(--f-mono);color:var(--muted)}
.tag{font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px;white-space:nowrap}
.tag.tg-open{background:rgba(207,74,63,.18);color:var(--blood)}
.tag.tg-clash{background:rgba(214,166,79,.18);color:var(--brass)}
.tag.tg-guard{background:rgba(79,168,162,.18);color:var(--tide)}
.aimers{display:flex;flex-wrap:wrap;gap:4px;font:11px var(--f-mono);color:var(--muted)}
.aimers span{color:var(--hue)}

.stage{min-height:250px;background:radial-gradient(circle at 50% 40%,#2a2226,var(--panel) 75%);border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;padding:18px 12px;overflow:hidden}
.stage-idle{text-align:center;display:grid;gap:6px;justify-items:center}
.stage-idle .big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase}
.stage-idle p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.clash{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;width:100%;align-items:center}
.cs{text-align:center;display:grid;gap:6px;justify-items:center;min-width:0;transition:opacity .2s}
.cs-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.cs-skill{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.cs-coins{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:22px;perspective:200px}
.cs-total{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,6vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.cs-total.bump{animation:bump .3s ease-out}
.cs-total.dmg{color:var(--blood)}
.cs.won .cs-total{color:var(--brass)}
.cs.lost{opacity:.55}
.cs-note{font:11px var(--f-mono);color:var(--muted);min-height:15px}
.cvs{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;writing-mode:vertical-rl;transform:rotate(180deg)}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}

.planner{margin-top:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;align-content:start}
.plan.active{border-color:var(--brass)}
.phead{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;text-align:left;width:100%}
.phead .uname{font-weight:700}
.phead .glyph{width:10px;height:10px;background:var(--hue);transform:rotate(45deg);border-radius:2px}
.phead .meta{margin-left:auto;font:12px var(--f-mono);color:var(--muted)}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:420px){.hand{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pline{font-size:13px;color:var(--muted);line-height:1.35}
.pline b{color:var(--fg)}
.odds{font-family:var(--f-mono);font-weight:600}
.odds.good{color:var(--ok)} .odds.bad{color:var(--blood)}
.warn{color:var(--brass)}
.plan.down{opacity:.5}

<script>
'use strict';
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function csPerStack(d){const E=CS_EFF[d.eff];return Math.max(.4,r1(E.v*d.str*CS_TRIG[d.trig].f*CS_DECAY[d.decay].f))}
function csFee(d){return Math.round(5+csPerStack(d)*5)}
function csDescribe(d){
  const E=CS_EFF[d.eff];
  if(d.trig==='while')return `While held, ${E.txt(0,d)}. ${CS_DECAY[d.decay].label}. Max 10 stacks.`;
  const a=d.eff==='stagger'?`${d.str*2} × stacks`:`${d.str} × stacks`;
  return `${CS_TRIG[d.trig].label}, ${E.txt(a,d)}. ${CS_DECAY[d.decay].label}. Max 10 stacks.`;
}
function effDef(key){
  if(EFFECTS[key])return EFFECTS[key];
  if(typeof key==='string'&&key.startsWith('cs_')){
    const d=save.statuses[key.slice(3)];if(!d)return null;
    return{label:d.name,kind:d.pol,on:d.pol==='debuff'?'target':'self',cs:d.id,owner:d.owner,cost:d.perStack,max:5,txt:n=>`${d.pol==='debuff'?'inflict':'gain'} ${n} ${d.name}`};
  }
  return null;
}

  heal:   {label:'Recover HP',v:.9,max:10,txt:p=>`recover ${p.amt} HP`},
  sp:     {label:'Recover Sanity',v:.5,max:10,txt:p=>`recover ${p.amt} Sanity`},
  shield: {label:'Gain Shield',v:.6,max:10,txt:p=>`gain ${p.amt} Shield`},
  self:   {label:'Gain a status',max:5,txt:p=>{const e=effDef(p.status);return e?e.txt(p.amt):'(removed status)'}},
  inflict:{label:'Inflict a status',max:5,txt:p=>{const e=effDef(p.status);return e?`${e.txt(p.amt)} on ${p.trig==='hit'?'the attacker':'a random enemy'}`:'(removed status)'}},
};
function passiveVal(p){if(p.eff==='self'||p.eff==='inflict'){const e=effDef(p.status);return e?e.cost*.8:0}return P_EFF[p.eff].v}
function passiveCost(p){return Math.round(4+passiveVal(p)*p.amt*P_TRIG[p.trig].f*2.5)}
function passiveText(p){return `${P_TRIG[p.trig].label}: ${P_EFF[p.eff].txt(p)}.`}
function passiveStatusOptions(eff,owner){
  const want=eff==='self'?'self':'target';
  const base=Object.keys(EFFECTS).filter(k=>{const e=EFFECTS[k];return e.kind!=='drawback'&&e.on===want&&(e.st||k==='burst')});
  const mine=Object.values(save.statuses).filter(d=>d.owner===owner&&(d.pol==='debuff')===(want==='target')).map(d=>'cs_'+d.id);
  return[...base,...mine];
}

const SAVE_KEY='tollbound-save-v1';
function defaultSave(){
  const o={v:2,tokens:{},customs:{},statuses:{},passives:{},passEq:{},loadout:{},looks:{},team:['vesna','oren','mireille'],cleared:{},best:0,streak:0,wins:0,speed:1};
  CHAR_IDS.forEach(id=>{o.tokens[id]=6;o.loadout[id]=[...CHARS[id].base];o.passEq[id]=[];o.looks[id]={...CHARS[id].look}});
  return o;
}
const OLD_FX={shatter:'rupture',focus:'poise',might:'powerup',weaken:'powerdown',rattle:'paralysis',jinx:'sinking',dread:'sinking',rot:'burn'};
function loadSave(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){
    const s=JSON.parse(raw),d=defaultSave();
    const o={...d,...s,tokens:{...d.tokens,...s.tokens},loadout:{...d.loadout,...s.loadout},passEq:{...d.passEq,...(s.passEq||{})},statuses:s.statuses||{},passives:s.passives||{},looks:{}};
    CHAR_IDS.forEach(id=>o.looks[id]={...d.looks[id],...((s.looks||{})[id]||{})});
    Object.values(o.customs).forEach(c=>{c.effects=(c.effects||[]).map(f=>({...f,eff:OLD_FX[f.eff]||f.eff})).filter(f=>EFFECTS[f.eff]||(String(f.eff).startsWith('cs_')&&o.statuses[f.eff.slice(3)]))});
    o.v=2;return o}}catch(e){}
  return defaultSave();
}

/* ---------- skill math ---------- */
function skillRange(s,bonus=0){const lo=s.base+bonus+Math.min(0,s.coinPow)*s.coins,hi=s.base+bonus+Math.max(0,s.coinPow)*s.coins;return[Math.max(0,lo),Math.max(0,hi)]}
function maxHit(s){let p=s.base,t=0;for(let i=0;i<s.coins;i++){if(s.coinPow>0)p+=s.coinPow;t+=Math.max(0,p)}return t}
function costParts(s){
  const parts=[];
  if(s.base>3)parts.push([`Base power ${s.base}`,(s.base-3)*2]);
  if(s.coins>1)parts.push([`${s.coins} coins`,(s.coins-1)*4]);
  if(s.coinPow>1)parts.push([`Coin power +${s.coinPow} × ${s.coins} coin${s.coins>1?'s':''}`,(s.coinPow-1)*s.coins]);
  if(s.coinPow<0)parts.push([`Coin power ${s.coinPow} drawback`,s.coinPow*s.coins*.5]);
  for(const f of s.effects){const e=effDef(f.eff);if(e)parts.push([`${TRIGGERS[f.trig].label} · ${e.label} ${f.amt}`,e.cost*f.amt*TRIGGERS[f.trig].mult(s.coins)])}
  return parts;
}
// Drawbacks and negative coin power refund tokens, but never more than 40% of what the rest of the skill costs.
function costSummary(s){
  const parts=costParts(s);let P=0,N=0;parts.forEach(p=>{if(p[1]>=0)P+=p[1];else N+=p[1]});
  const cap=-.4*P,capped=N<cap,raw=P+Math.max(N,cap);
  return{parts,P,N,capped,raw,total:Math.max(3,Math.round(raw))};
}
function skillCost(s){return costSummary(s).total}
function skillCard(s,o={}){
  const [lo,hi]=skillRange(s,o.bonus||0);
  const tag=o.button?'button':'div';
  const fx=(s.effects||[]).map(f=>{const e=effDef(f.eff);return `<span><b>${TRIGGERS[f.trig].label}:</b> ${e?esc(e.txt(f.amt)):'(removed status)'}</span>`}).join('');
  return `<${tag} class="skill t-${s.type} ${o.cls||''}" ${o.button?'type="button"':''} ${o.attrs||''}>
    <span class="sk-head"><span class="sk-type">${TYPES[s.type]}</span><span>${lo}–${hi}</span></span>
    <span class="sk-name">${esc(s.name)}</span>
    <span class="sk-pow"><b>${s.base}</b><span class="coins">${'<i class="coin"></i>'.repeat(s.coins)}</span><span>${sgn(s.coinPow)}</span></span>
    ${fx?`<span class="sk-fx">${fx}</span>`:''}
  </${tag}>`;
}
function resLine(res){return['slash','pierce','blunt'].map(k=>`<span class="${res[k]>1?'weak':res[k]<1?'tough':''}">${TYPES[k]} ×${res[k]}</span>`).join('')}

function dollSVG(look,weapon,view='0 0 120 200'){
  const k={...BASE_LOOK,...look};
  const s=k.skin,h=k.hairColor,o=outfitParts(k);
  const hand=k.extra==='gloves'?k.extraColor:s;
  const shoes=o.boots?P('M48 150 L58 150 L58 178 Q64 181 64 186 L48 186Z','#231c1c')+P('M61 150 L71 150 L71 178 Q77 181 77 186 L61 186Z','#2b2222'):P('M48 178 L58 178 Q64 181 64 186 L48 186Z','#231c1c')+P('M61 178 L71 178 Q77 181 77 186 L61 186Z','#2b2222');
  const legs=o.hideLegs?'':`<rect x="49" y="120" width="9.5" height="60" rx="3" fill="${shade(o.pants,-.12)}" stroke="${OL}" stroke-width="1.4"/><rect x="61.5" y="120" width="9.5" height="60" rx="3" fill="${o.pants}" stroke="${OL}" stroke-width="1.4"/>`;
  const sleeveB=o.wide?P('M42 72 L53 72 L56 113 L39 113Z',shade(o.sleeve,-.18)):`<rect x="43" y="72" width="10" height="44" rx="5" fill="${shade(o.sleeve,-.18)}" stroke="${OL}" stroke-width="1.4"/>`;
  const sleeveF=o.wide?P('M66 72 L77 72 L81 113 L64 113Z',o.sleeve):`<rect x="67" y="72" width="10" height="44" rx="5" fill="${o.sleeve}" stroke="${OL}" stroke-width="1.4"/>`;
  const armband=k.extra==='armband'?`<rect x="66.6" y="83" width="10.8" height="5" fill="${k.extraColor}" stroke="${OL}" stroke-width="1"/>`:'';
  const w=WEAPONS[weapon]?WEAPONS[weapon](k.c3):'';
  const mask=k.extra==='mask'?P('M47 50 Q60 48 73 50 L72 58 Q60 64 48 58Z',k.extraColor):'';
  const earring=k.extra==='earring'?`<circle cx="75.6" cy="52.4" r="1.9" fill="${k.extraColor}" stroke="${OL}" stroke-width=".8"/>`:'';
  const hb=HAIR_BACK[k.hair]?HAIR_BACK[k.hair](h):'';
  const hf=(HAIR_FRONT[k.hair]||HAIR_FRONT.crop)(h);
  // Chibi proportions: the head layer is drawn 1.85× and dropped onto the shoulders,
  // the body layer is squashed to a short, stubby frame standing on the same feet.
  const HEAD='transform="translate(60 84) scale(1.85) translate(-60 -44)"';
  const BODY='transform="translate(60 188) scale(.95 .62) translate(-60 -188)"';
  const eye=x=>`<g transform="translate(${x} 47) scale(1.3) translate(${-x} -46)">${(EYES[k.eyes]||EYES.round)(x,k.eyeColor,s)}</g>`;
  const handB=`<ellipse cx="48" cy="117" rx="4.8" ry="7.4" fill="${shade(hand,-.12)}" stroke="${OL}" stroke-width="1.3"/>`;
  const handF=`<ellipse cx="72" cy="117" rx="4.8" ry="7.4" fill="${hand}" stroke="${OL}" stroke-width="1.3"/>`;
  return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <ellipse cx="60" cy="191" rx="30" ry="5" fill="#000" opacity=".35"/>
  <g class="body">
    <g ${BODY}>${(BACKWEAR[k.back]||BACKWEAR.none)(k.backColor)}${o.back||''}</g>
    <g ${HEAD}>${hb}</g>
    <g ${BODY}>
      <g class="armB">${sleeveB}${handB}</g>
      ${legs}${shoes}
      <rect x="55" y="55" width="10" height="15" fill="${shade(s,-.12)}" stroke="${OL}" stroke-width="1.3"/>
      ${o.torso}
      ${(NECKWEAR[k.neck]||NECKWEAR.none)(k.neckColor)}
    </g>
    <g ${HEAD}>
      <ellipse cx="45" cy="47" rx="2.6" ry="4" fill="${s}" stroke="${OL}" stroke-width="1"/><ellipse cx="75" cy="47" rx="2.6" ry="4" fill="${s}" stroke="${OL}" stroke-width="1"/>
      <ellipse cx="60" cy="44" rx="15.5" ry="16.5" fill="${s}" stroke="${OL}" stroke-width="1.1"/>
      ${(MARKS[k.mark]||MARKS.none)(s)}
      ${eye(54)}${eye(66)}
      ${(BROWS[k.brows]||BROWS.flat)(shade(h,-.25))}
      ${(MOUTHS[k.mouth]||MOUTHS.line)()}
      ${mask}${earring}${hf}
      ${(HATS[k.hat]||HATS.none)(k.hatColor)}
      ${(EYEWEAR[k.eyewear]||EYEWEAR.none)(k.ewColor)}
    </g>
    <g ${BODY}><g class="armF">${sleeveF}${armband}${w}${handF}</g></g>
  </g></svg>`;
}

function swatchRow(key,pal){

function chipRow(key){

function thumbGrid(key,view){

function wdField(label,inner){return `<div class="wd-field"><h4>${label}</h4>${inner}</div>`}

  else if(sec==='hair')body=wdField('Hairstyle',thumbGrid('hair','16 24 88 88'))+wdField('Hair color',swatchRow('hairColor','hair'));
  else if(sec==='outfit')body=wdField('Outfit',thumbGrid('outfit','4 36 112 158'))+wdField('Primary color',swatchRow('c1','cloth'))+wdField('Secondary color',swatchRow('c2','cloth'))+wdField('Accent color',swatchRow('c3','cloth'));
  else body=[['hat','Headwear','hatColor'],['eyewear','Eyewear','ewColor'],['neck','Neckwear','neckColor'],['back','Back','backColor'],['extra','Extras','extraColor']].map(([k,l,ck])=>wdField(l,chipRow(k)+(curLook()[k]!=='none'?swatchRow(ck,'cloth'):''))).join('');

function updateWardrobePreview(){const d=$('#wdDoll');if(d)d.innerHTML=dollSVG(curLook(),CHARS[wardrobe.char].weapon)}
function setLook(k,v){save.looks[wardrobe.char][k]=v;persist()}
function randomLook(){
  const l={};
  for(const k of Object.keys(W_OPTS))l[k]=pick(W_OPTS[k])[0];
  if(Math.random()<.5)l.hat='none';if(Math.random()<.6)l.eyewear='none';if(Math.random()<.4)l.back='none';
  l.skin=pick(SWATCH.skin.slice(0,8));l.hairColor=pick(SWATCH.hair);l.eyeColor=pick(SWATCH.eye);
  ['c1','c2','c3','hatColor','ewColor','neckColor','backColor','extraColor'].forEach(k=>l[k]=pick(SWATCH.cloth));
  save.looks[wardrobe.char]={...BASE_LOOK,...l};persist();
}

function renderHeader(){
  document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('on',b.dataset.v===view);b.disabled=view==='battle'});
  $('#tokens').innerHTML=CHAR_IDS.map(id=>`<span class="tok" style="--hue:var(--c-${id})" title="${CHARS[id].name}: ${save.tokens[id]} Character Tokens"><i></i>${CHARS[id].short}<b>${save.tokens[id]}</b></span>`).join('');
}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  renderHeader();
  const el=$('#view');
  if(view==='contracts')el.innerHTML=viewContracts();
  else if(view==='roster')el.innerHTML=viewRoster();
  else if(view==='wardrobe')el.innerHTML=viewWardrobe();
  else if(view==='forge'){el.innerHTML=viewForge();afterForgeRender()}
  else if(view==='battle'){el.innerHTML='';renderBattle()}
}

/* ---------- contracts ---------- */
function foeSummary(list){const m={};list.forEach(id=>m[id]=(m[id]||0)+1);return Object.entries(m).map(([id,n])=>`${n>1?n+'× ':''}${ENEMIES[id].name}`).join(' · ')}
function glossary(){
  return `<details class="howto glossary"><summary>Status glossary</summary><dl>${STATUS_ORDER.map(k=>`<div><dt class="st-${k}">${STATUS[k].label}</dt><dd>${STATUS[k].info}</dd></div>`).join('')}
    <div><dt class="st-shield">Shield</dt><dd>Absorbs damage from hits. Clears at the end of the turn.</dd></div></dl>
    <p class="muted sm">Burn, Bleed, Tremor, Rupture, Sinking and Poise show as Potency·Count, for example “Burn 3·2”.</p></details>`;
}
function viewContracts(){
  const tickets=STAGES.map((st,i)=>{
    const cleared=!!save.cleared[st.id],locked=i>0&&!save.cleared[STAGES[i-1].id];
    const rew=cleared?Math.ceil(st.reward/3):st.reward;
    return `<article class="ticket ${locked?'locked':''}">
      <div class="t-stub"><span class="t-no">No. ${String(i+1).padStart(3,'0')}</span><span class="t-rew"><b>${rew}</b>TKN</span></div>
      <div class="t-body"><h3>${st.name}</h3><p>${st.blurb}</p><p class="t-foes">${foeSummary(st.enemies)}</p>
      <div class="t-foot"><span>${cleared?`Replay · ${rew} tokens each`:`First clear · ${rew} tokens each`}</span>
      <button class="btn ${cleared?'ghost':''}" data-act="start" data-stage="${i}" ${locked?'disabled':''}>${locked?'Locked':cleared?'Replay':'Take contract'}</button></div></div>
      ${cleared?'<span class="stamp" aria-label="Cleared">PAID</span>':''}
    </article>`;
  }).join('');
  const night=`<article class="ticket night">
    <div class="t-stub"><span class="t-no">Night Shift</span><span class="t-rew"><b>${3+save.streak}</b>TKN</span></div>
    <div class="t-body"><h3>Night Shift</h3><p>Endless random fights that get harder every hour. A loss ends the shift. Bosses show up every fifth hour.</p>
    <p class="t-foes">Current hour ${save.streak+1} · Best run ${save.best} hour${save.best===1?'':'s'}</p>
    <div class="t-foot"><span>${3+save.streak} tokens each per win</span><button class="btn" data-act="night">${save.streak?'Continue shift':'Clock in'}</button></div></div>
  </article>`;
  return `<section class="intro">
    <div><p class="eyebrow">Turn-based clash combat</p><h1>Win the clash. Forge what you earn.</h1>
    <p class="lede">Take contracts on the pier and bring home Character Tokens for every fighter you fielded. Spend them in the Skill Forge on skills, unique statuses and passives, and dress your squad in the Wardrobe.</p></div>
    <div class="intro-side">
    <details class="howto" ${save.wins?'':'open'}><summary>How a turn works</summary><ol>
      <li><b>Everyone rolls a speed die.</b> Enemies show which skill they’ll use and who they’re aiming at.</li>
      <li><b>Pick a skill and a target</b> for each fighter. Two skills from their loadout are dealt each turn, plus Brace.</li>
      <li><b>Clash</b> happens when you aim at an enemy whose attack targets you, or when you’re faster than that enemy’s die. Otherwise attacks land unopposed.</li>
      <li><b>In a clash</b> both sides flip their coins: base power plus heads × coin power. The higher total breaks one of the loser’s coins. The winner hits with whatever coins remain.</li>
      <li><b>Sanity</b> raises your heads chance. Winning clashes and finishing enemies builds it.</li>
      <li><b>Stagger</b> enemies by pushing HP past the brass marks on their bar. Staggered units skip a turn and take double damage.</li>
    </ol></details>${glossary()}</div>
  </section>
  <div class="teambar"><span class="lbl">Fielding</span>${save.team.map(id=>`<span class="chip" style="--hue:var(--c-${id})"><i></i>${CHARS[id].short}</span>`).join('')}<button class="btn ghost sm" data-act="go" data-v="roster">Change team</button></div>
  <section class="tickets" aria-label="Contracts">${tickets}${night}</section>`;
}

/* ---------- roster ---------- */

  <p class="lede">Field one to three fighters. Each fielded fighter earns their own Character Tokens: full reward if they’re standing at the end, half if they went down.</p></div>
  <div class="roster">${CHAR_IDS.map(id=>{const c=CHARS[id],on=save.team.includes(id);

    return `<article class="rcard ${on?'on':''}" style="--hue:var(--c-${id})">
      <header><div class="portrait">${dollSVG(save.looks[id],c.weapon,'22 34 76 84')}</div><div><h3>${c.name}</h3><p class="role">${c.role}</p></div><span class="tokbig"><b>${save.tokens[id]}</b>tokens</span></header>
      <p>${c.bio}</p>
      <dl class="stats"><div><dt>HP</dt><dd>${c.hp}</dd></div><div><dt>Speed</dt><dd>${c.spd[0]}–${c.spd[1]}</dd></div>${['slash','pierce','blunt'].map(k=>`<div><dt>${TYPES[k]}</dt><dd class="${c.res[k]>1?'weak':c.res[k]<1?'tough':''}">×${c.res[k]}</dd></div>`).join('')}</dl>
      <div class="mini-skills">${save.loadout[id].map(getSkill).filter(Boolean).map(s=>skillCard(s,{cls:'mini'})).join('')}</div>
      <div class="pas-list">${pas.length?pas.map(p=>`<span class="pas-chip" title="${esc(passiveText(p))}">◈ ${esc(p.name)}</span>`).join(''):'<span class="muted sm">No passives equipped. Unlock them in the Skill Forge.</span>'}</div>
      <div class="ractions"><button class="btn ${on?'ghost':''}" data-act="field" data-c="${id}" ${dis?'disabled':''} title="${dis&&!on?'Bench someone first: three is the limit':''}">${on?'Bench':'Field'}</button><button class="btn ghost" data-act="forgefor" data-c="${id}">Forge</button><button class="btn ghost" data-act="dressfor" data-c="${id}">Wardrobe</button></div>
    </article>`}).join('')}</div>
  <div class="danger-zone"><button class="btn ghost danger sm" data-act="reset">Reset all progress</button><span class="muted sm">Progress is saved in this browser only.</span></div></section>`;

function toggleTeam(id){
  const i=save.team.indexOf(id);
  if(i>=0){if(save.team.length>1)save.team.splice(i,1)}else if(save.team.length<3)save.team.push(id);
  persist();render();
}

let csDraft={name:'',glyph:'✦',color:'#9fd1a8',pol:'debuff',trig:'turnEnd',eff:'dmg',str:1,decay:'one'};

/* ---------- forge: skills ---------- */

      </div>
      <div><div class="fx-head"><h4>Effects</h4><span class="muted sm">up to 4 · trigger → effect → amount</span></div>
        <div id="fxList"></div>
        <button type="button" class="btn ghost sm" data-act="addfx" id="addFx">Add effect</button></div>
    </form>
    <aside class="panel forge-preview" id="forgePreview" aria-live="polite"></aside>
  </div>

function draftSkill(){return{id:'draft',name:draft.name.trim()||'Unnamed skill',type:draft.type,base:+draft.base,coins:+draft.coins,coinPow:+draft.coinPow,effects:draft.effects.map(f=>({trig:f.trig,eff:f.eff,amt:+f.amt}))}}
function effAllowed(key,guard,trig){
  const e=effDef(key);if(!e)return false;
  if(e.owner&&e.owner!==forge.char)return false;
  if(e.on==='target'&&(guard||TRIGGERS[trig].selfOnly))return false;
  return true;
}
function normalizeDraft(){
  draft.effects.forEach(f=>{
    if(draft.type==='guard'&&!TRIGGERS[f.trig].pre)f.trig='use';
    if(!effAllowed(f.eff,draft.type==='guard',f.trig))f.eff=effAllowed(CHARS[forge.char].sig,draft.type==='guard',f.trig)?CHARS[forge.char].sig:'sanity';
    f.amt=clamp(f.amt,1,effDef(f.eff).max);
  });
}
function trigOptions(cur,guard){
  return TRIG_GROUPS.map(g=>{const ks=Object.keys(TRIGGERS).filter(k=>TRIGGERS[k].group===g&&(!guard||TRIGGERS[k].pre));
    return ks.length?`<optgroup label="${g}">${ks.map(k=>`<option value="${k}" ${cur===k?'selected':''}>${TRIGGERS[k].label}</option>`).join('')}</optgroup>`:''}).join('');
}
function effOptions(cur,guard,trig){
  const groups=EFFECT_GROUPS.map(([kind,label])=>[label,Object.keys(EFFECTS).filter(k=>EFFECTS[k].kind===kind&&effAllowed(k,guard,trig))]);
  const mine=Object.values(save.statuses).filter(d=>d.owner===forge.char).map(d=>'cs_'+d.id).filter(k=>effAllowed(k,guard,trig));
  if(mine.length)groups.unshift([`${CHARS[forge.char].short}’s unique statuses`,mine]);
  return groups.map(([label,ks])=>ks.length?`<optgroup label="${esc(label)}">${ks.map(k=>`<option value="${k}" ${cur===k?'selected':''}>${esc(effDef(k).label)}</option>`).join('')}</optgroup>`:'').join('');
}
function effInfo(key){
  const e=effDef(key);if(!e)return'';
  if(e.cs)return csDescribe(save.statuses[e.cs]);
  if(e.st)return `${STATUS[e.st].label}: ${STATUS[e.st].info}`;
  if(key==='burst')return STATUS.tremor.info;
  return DRAWBACK_INFO[key]||'';
}
function renderFxList(){
  const el=$('#fxList');if(!el)return;
  const guard=draft.type==='guard';
  el.innerHTML=draft.effects.length?draft.effects.map((f,i)=>{
    const E=effDef(f.eff),T=TRIGGERS[f.trig];
    const val=E.cost*f.amt*T.mult(draft.coins);
    const rate=T.per?`×${T.mult(1)} per coin (×${r1(T.mult(draft.coins))} on ${draft.coins} coin${draft.coins>1?'s':''})`:`×${T.mult(1)}`;
    return `<div class="fx-row ${E.kind==='drawback'?'drawback':''}">
      <select id="fx-trig-${i}" data-fx="${i}" data-k="trig" aria-label="Trigger ${i+1}">${trigOptions(f.trig,guard)}</select>
      <select id="fx-eff-${i}" data-fx="${i}" data-k="eff" aria-label="Effect ${i+1}">${effOptions(f.eff,guard,f.trig)}</select>
      <div class="stepper"><button type="button" data-act="fxamt" data-fx="${i}" data-d="-1" aria-label="Lower amount" ${f.amt<=1?'disabled':''}>−</button><span>${f.amt}</span><button type="button" data-act="fxamt" data-fx="${i}" data-d="1" aria-label="Raise amount" ${f.amt>=E.max?'disabled':''}>+</button></div>
      <button type="button" class="linkbtn" data-act="rmfx" data-fx="${i}">Remove</button>
      <p class="fx-desc"><b>${T.label}:</b> ${esc(E.txt(f.amt))}, ${T.help}. ${esc(effInfo(f.eff))}
        <span class="fx-cost">Trigger rate ${rate} · ${val<0?`refunds ${r1(-val)}`:`costs ${r1(val)}`} tokens</span></p>
    </div>`}).join(''):`<p class="muted" style="margin:0">No effects yet. Conditional triggers cost less than On Use because they don’t always fire. Drawbacks hurt the user but refund tokens.</p>`;
  const add=$('#addFx');if(add)add.disabled=draft.effects.length>=4;
}
function updateForgePreview(){
  const pv=$('#forgePreview');if(!pv)return;
  $('#o-base').textContent=draft.base;$('#o-coins').textContent=draft.coins;$('#o-cp').textContent=sgn(+draft.coinPow);
  const s=draftSkill(),cs=costSummary(s),cost=cs.total,bal=save.tokens[forge.char],[lo,hi]=skillRange(s),cn=CHARS[forge.char].short;
  const avg=(s.base+s.coins*s.coinPow*.5);
  pv.innerHTML=`<p class="eyebrow">Preview · ${cn}</p>${skillCard(s,{cls:'big'})}
    <dl class="pv-stats"><div><dt>Clash range</dt><dd>${lo}–${hi}</dd></div><div><dt>Avg roll</dt><dd>${Math.max(0,avg).toFixed(1)}</dd></div><div><dt>Best hit total</dt><dd>${s.type==='guard'?'—':maxHit(s)}</dd></div></dl>
    <div class="cost"><h4>Token cost</h4><ul>${cs.parts.length?cs.parts.map(([l,v])=>`<li class="${v<0?'neg':''}"><span>${esc(l)}</span><b>${v>0?'+':''}${r1(v)}</b></li>`).join(''):'<li><span>Starter frame</span><b>+3</b></li>'}</ul>
    ${cs.capped?`<p class="note" style="margin-top:6px">Refunds capped at 40% of the skill’s cost (−${r1(-cs.N)} counted as −${r1(.4*cs.P)}).</p>`:''}
    <div class="cost-total"><span>Total${cs.raw<3?' (minimum 3)':''}</span><b>${cost}</b></div><div class="cost-bal"><span>${cn} has</span><b>${bal}</b></div></div>
    <button type="button" class="btn big wide" data-act="forge" ${bal<cost?'disabled':''}>Forge for ${cost} tokens</button>
    ${bal<cost?`<p class="note">${cn} needs ${cost-bal} more. Field ${cn} in contracts to earn them, or trim the build.</p>`:''}`;
  renderLibrary();
}
function renderLibrary(){
  const el=$('#library');if(!el)return;
  const c=forge.char,lo=save.loadout[c];
  const skills=[...CHARS[c].base.map(id=>SK[id]),...Object.values(save.customs).filter(s=>s.owner===c)];
  el.innerHTML=`<div class="lib-head"><h2 class="h-sub">${CHARS[c].short}’s skills</h2><span class="pill">Loadout ${lo.length}/4</span><span class="muted sm">Equipped skills are dealt into ${CHARS[c].short}’s hand in combat.</span></div>
  <div class="lib">${skills.map(s=>{const eq=lo.includes(s.id),pend=forge.pending===s.id;
    const dis=(!eq&&lo.length>=4)||(eq&&lo.length<=1);
    return `<div class="lib-item ${eq?'eq':''}">${skillCard(s)}<div class="lib-actions">
      <button type="button" class="btn sm ${eq?'ghost':''}" data-act="equip" data-id="${s.id}" ${dis?'disabled':''}>${eq?'Unequip':'Equip'}</button>
      ${s.custom?`<button type="button" class="btn sm ghost" data-act="rework" data-id="${s.id}">Rework</button><button type="button" class="btn sm ghost danger" data-act="dismantle" data-id="${s.id}">${pend?`Confirm · refund ${Math.floor(s.cost/2)}`:'Dismantle'}</button>`:'<span class="muted sm">Starter</span>'}
      ${eq?'<span class="eqmark">Equipped</span>':''}
    </div></div>`}).join('')}</div>`;
}
function doForge(){
  const s=draftSkill();if(!draft.name.trim())s.name=randName();
  const c=forge.char,cost=skillCost(s);if(save.tokens[c]<cost)return;
  save.tokens[c]-=cost;
  const id=newId('c');
  save.customs[id]={...s,id,owner:c,cost,custom:true};
  const eq=save.loadout[c].length<4;if(eq)save.loadout[c].push(id);
  persist();draft.name='';render();
  toast(`${CHARS[c].short} forged ${s.name}${eq?' and equipped it':'. Loadout is full, so unequip something to use it'}.`);
}
function toggleEquip(id){
  const lo=save.loadout[forge.char],i=lo.indexOf(id);
  if(i>=0){if(lo.length>1)lo.splice(i,1)}else if(lo.length<4)lo.push(id);
  persist();renderLibrary();
}
function doDismantle(id){
  if(forge.pending!==id){forge.pending=id;renderLibrary();return}
  const s=save.customs[id];if(!s)return;
  const refund=Math.floor(s.cost/2);save.tokens[s.owner]+=refund;delete save.customs[id];
  const lo=save.loadout[s.owner],i=lo.indexOf(id);if(i>=0)lo.splice(i,1);
  if(!lo.length)lo.push(CHARS[s.owner].base[0]);
  forge.pending=null;persist();render();toast(`Dismantled ${s.name}. Refunded ${refund} tokens.`);
}
function reworkSkill(id){
  const s=getSkill(id);if(!s)return;
  draft={name:(s.name.length<25?s.name+' II':s.name),type:s.type,base:s.base,coins:s.coins,coinPow:s.coinPow,effects:s.effects.map(f=>({...f}))};
  render();window.scrollTo({top:0,behavior:'smooth'});toast('Loaded into the forge. Forging makes a new copy.');
}

/* ---------- forge: unique statuses ---------- */
function csValidEffs(){return Object.keys(CS_EFF).filter(k=>{const E=CS_EFF[k];return(E.pol==='both'||E.pol===csDraft.pol)&&(csDraft.trig==='while'?E.only==='while':!E.only)})}
function csValidDecays(){return Object.keys(CS_DECAY).filter(k=>csDraft.trig==='while'?!CS_DECAY[k].trig:true)}
function normalizeCS(){
  if(!csValidEffs().includes(csDraft.eff))csDraft.eff=csValidEffs()[0];
  if(!csValidDecays().includes(csDraft.decay))csDraft.decay=csValidDecays()[0];
}
function csUsage(id){
  const key='cs_'+id;
  return Object.values(save.customs).filter(s=>s.effects.some(f=>f.eff===key)).length+Object.values(save.passives).filter(p=>p.status===key).length;
}

  normalizeCS();
  const d=csDraft;
  return `<div class="forge-grid">
    <form class="panel forge-form" id="csForm" autocomplete="off">
      <div><label class="fl" for="f-cs-name">Status name</label>
        <div class="inline"><input type="text" id="f-cs-name" maxlength="18" placeholder="e.g. ${pick(ST_NAME_A)} ${pick(ST_NAME_B)}" value="${esc(d.name)}"><button type="button" class="btn ghost sm" data-act="csrand">Roll a name</button></div></div>
      <div><span class="fl">Icon</span><div class="chips">${CS_GLYPHS.map(g=>`<button type="button" class="chipbtn glyph ${d.glyph===g?'on':''}" data-act="csglyph" data-v="${g}" aria-pressed="${d.glyph===g}">${g}</button>`).join('')}</div></div>

/* ---------- battle: setup ---------- */
let B=null,uidN=0;
function mkUnit(o){
  const st={};STATUS_ORDER.forEach(k=>st[k]=0);
  const cnt={};PC_KEYS.forEach(k=>cnt[k]=0);
  return{uid:'u'+(uidN++),side:o.side,key:o.key,name:o.name,maxHp:o.hp,hp:o.hp,spd:o.spd,res:o.res,nd:o.nd||1,skills:o.skills,
    staggerHP:o.stagger.map(f=>Math.round(o.hp*f)),staggerSpent:[],st,cnt,exp:{},cs:{},shield:0,sp:0,stag:false,stagUntil:-1,dice:[],
    powBonus:o.powBonus||0,dead:false,look:o.look,weapon:o.weapon,scale:o.scale||1,passives:o.passives||[],slot:o.slot,_pose:''};
}
function genNight(s){
  const pool=['rat','thug','acolyte','clerk','collector','fixer','cantor'];
  const avail=pool.slice(0,Math.min(pool.length,3+s));
  let n=Math.min(4,2+Math.floor(s/2));const list=[];
  if((s+1)%5===0){list.push(pick(s>=9?['keeper','grinder','tollkeeper']:['keeper','grinder']));n=Math.max(1,n-2)}
  for(let i=0;i<n;i++)list.push(pick(avail));
  return list;
}
function startBattle(stage){
  const night=stage==='night',lvl=night?save.streak:0;
  const list=night?genNight(save.streak):STAGES[stage].enemies;
  const allies=save.team.map((id,i)=>{const c=CHARS[id];return mkUnit({side:'ally',key:id,name:c.short,hp:c.hp,spd:c.spd,res:c.res,stagger:c.stagger,skills:save.loadout[id].filter(getSkill),
    look:save.looks[id],weapon:c.weapon,passives:save.passEq[id].map(p=>save.passives[p]).filter(Boolean).map(p=>({...p})),slot:i})});
  const counts={},seen={};list.forEach(id=>counts[id]=(counts[id]||0)+1);
  const enemies=list.map((id,i)=>{const e=ENEMIES[id];seen[id]=(seen[id]||0)+1;
    return mkUnit({side:'enemy',key:id,name:e.name+(counts[id]>1?' '+'ABCD'[seen[id]-1]:''),hp:Math.round(e.hp*(1+.1*lvl)),spd:e.spd,res:e.res,stagger:e.stagger,skills:e.skills,nd:e.dice||1,powBonus:Math.floor(lvl/3),look:e.look,weapon:e.weapon,scale:e.scale,slot:i})});
  B={stage,night,lvl,name:night?`Night Shift · Hour ${save.streak+1}`:STAGES[stage].name,allies,enemies,turn:1,phase:'plan',log:[],plans:[],active:null,over:null,engs:[]};
  view='battle';render();window.scrollTo(0,0);
  B.allies.forEach(a=>firePassive(a,'start'));
  startTurn();
}
const alive=l=>l.filter(u=>u.hp>0);
const randomAlive=l=>{const a=alive(l);return a.length?pick(a):null};
const canAct=u=>u.hp>0&&!u.stag;
function changeSP(u,n){if(u.hp<=0)return;u.sp=clamp(u.sp+n,-45,45)}

/* ---------- statuses at runtime ---------- */
function addStatus(u,key,n,mode){
  if(!u||u.hp<=0||n<=0)return;const S=STATUS[key];
  if(S.pc){if(mode==='c'){u.cnt[key]=Math.min(99,u.cnt[key]+n);if(!u.st[key])u.st[key]=1}else{u.st[key]=Math.min(99,u.st[key]+n);if(!u.cnt[key])u.cnt[key]=1}}
  else{u.st[key]=Math.min(S.max||20,u.st[key]+n);if(S.timed)u.exp[key]=B.turn+1}
}
function spendCount(u,key){u.cnt[key]--;if(u.cnt[key]<=0){u.cnt[key]=0;u.st[key]=0}}
const isAfflicted=u=>STATUS_ORDER.some(k=>STATUS[k].kind==='debuff'&&u.st[k]>0)||Object.keys(u.cs).some(id=>u.cs[id]>0&&save.statuses[id]&&save.statuses[id].pol==='debuff');
function csWhile(u,eff){
  let v=0;
  for(const id in u.cs){const n=u.cs[id],d=save.statuses[id];if(!n||!d||d.trig!=='while'||d.eff!==eff)continue;const sg=d.pol==='buff'?1:-1;
    if(eff==='power')v+=sg*Math.floor(n*d.str/2);else if(eff==='heads')v+=sg*.03*d.str*n;else if(eff==='dmgTaken')v-=sg*.05*d.str*n}
  return v;
}
const powMod=u=>(u.st.powerup||0)-(u.st.powerdown||0)+csWhile(u,'power')+(u.powBonus||0);
const headsP=u=>clamp(.5+u.sp/100+csWhile(u,'heads'),.05,.95);
function tremorBurst(u){
  if(!u||u.hp<=0)return;const p=u.st.tremor;if(!p)return;
  if(u.staggerHP.length)u.staggerHP[0]=Math.min(u.maxHp,u.staggerHP[0]+p);
  pop(u,`Tremor Burst +${p}`,'st-tremor');log(`Tremor Burst on ${u.name}: stagger threshold +${p}.`);
  spendCount(u,'tremor');afterDamage(u);
}
function fireCS(u,trig){
  if(u.hp<=0)return;
  for(const id of Object.keys(u.cs)){
    const n=u.cs[id],d=save.statuses[id];if(!n||!d||d.trig!==trig)continue;
    const a=n*d.str;
    switch(d.eff){
      case 'dmg':rawDamage(u,a,d.name,'cs',d.color);break;
      case 'sp':changeSP(u,d.pol==='buff'?a:-a);pop(u,`${d.pol==='buff'?'+':'-'}${a} SP`,'cs',d.color);break;
      case 'stagger':if(u.staggerHP.length)u.staggerHP[0]=Math.min(u.maxHp,u.staggerHP[0]+a*2);pop(u,`${d.name} +${a*2}`,'cs',d.color);afterDamage(u);break;
      case 'heal':{const h=Math.min(u.maxHp-u.hp,a);u.hp+=h;pop(u,`+${h} HP`,'cs',d.color);break}
      case 'shield':u.shield+=a;pop(u,`+${a} Shield`,'cs',d.color);break;
    }
    log(`${d.name} acts on ${u.name}.`);
    if(d.decay==='one')u.cs[id]=n-1;else if(d.decay==='half')u.cs[id]=Math.floor(n/2);
    if(u.hp<=0)return;
  }
}
function firePassive(u,trig,ctx={}){
  if(!u.passives||!u.passives.length||u.hp<=0)return;
  for(const p of u.passives){
    if(p.trig!==trig)continue;if(trig==='lowhp'&&!(u.hp<u.maxHp*.5))continue;
    switch(p.eff){
      case 'heal':{const h=Math.min(u.maxHp-u.hp,p.amt);u.hp+=h;pop(u,`+${h} HP`,'heal');break}
      case 'sp':changeSP(u,p.amt);pop(u,`+${p.amt} SP`,'sp');break;
      case 'shield':u.shield+=p.amt;pop(u,`+${p.amt} Shield`,'shield');break;
      case 'self':applyFx({eff:p.status,amt:p.amt},u,null);break;
      case 'inflict':{const t=ctx.attacker&&ctx.attacker.hp>0?ctx.attacker:randomAlive(u.side==='ally'?B.enemies:B.allies);if(t)applyFx({eff:p.status,amt:p.amt},u,t);break}
    }
    log(`${u.name}’s passive: ${p.name}.`);
  }
}

/* ---------- turn start / planning ---------- */
function startTurn(){
  SPEED.skip=false;
  const all=[...B.allies,...B.enemies];
  for(const u of all){
    u.dice=[];
    if(u.hp>0&&!u.stag)for(let i=0;i<u.nd;i++)u.dice.push({speed:Math.max(1,rnd(u.spd[0],u.spd[1])+u.st.haste-u.st.bind)});
    u.dice.sort((a,b)=>b.speed-a.speed);
    u.st.haste=0;u.st.bind=0;
  }
  all.forEach(u=>fireCS(u,'turnStart'));
  B.allies.forEach(a=>firePassive(a,'turnStart'));
  const o=checkOver();if(o){finishBattle(o==='win');return}
  const targets=alive(B.allies);
  for(const e of B.enemies)for(const d of e.dice){
    const s=getSkill(pick(e.skills));d.skill=s;
    if(s.type==='guard')d.target=e;
    else{const low=[...targets].sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];d.target=Math.random()<.35?low:pick(targets)}
  }
  B.plans=B.allies.map(a=>{
    if(!a.dice.length)return null;
    const hand=shuffle([...a.skills]).slice(0,2).map(getSkill).filter(Boolean);hand.push(SK.brace);
    return{hand,skill:null,target:null};
  });
  autoPlan();
  B.phase='plan';B.active=null;
  log(`Turn ${B.turn}`,'turn');
  renderBattle();
}
function autoPlan(){
  const used=new Set();
  const order=B.allies.map((a,i)=>i).filter(i=>B.plans[i]).sort((x,y)=>B.allies[y].dice[0].speed-B.allies[x].dice[0].speed);
  for(const i of order){
    const a=B.allies[i],p=B.plans[i];
    p.skill=p.hand.find(s=>s.type!=='guard')||p.hand[0];
    if(p.skill.type==='guard'){p.target=null;continue}
    let tgt=null;
    for(const e of B.enemies){if(e.hp<=0||tgt)continue;e.dice.forEach((d,di)=>{const k=e.uid+':'+di;if(!tgt&&d.target===a&&d.skill.type!=='guard'&&!used.has(k)){tgt=e;used.add(k)}})}
    p.target=tgt||randomAlive(B.enemies);
  }
}
function computeEngagements(){
  const engs=[],claimed=new Set(),edice=[];
  B.enemies.forEach(e=>{if(canAct(e))e.dice.forEach((d,di)=>edice.push({u:e,d,key:e.uid+':'+di}))});
  const acts=B.allies.map((a,i)=>({a,i,p:B.plans[i]})).filter(x=>x.p&&x.p.skill&&canAct(x.a)).sort((x,y)=>y.a.dice[0].speed-x.a.dice[0].speed);
  for(const {a,i,p} of acts){
    const sp=a.dice[0].speed,adie=a.dice[0];
    if(p.skill.type==='guard'){engs.push({kind:'guard',u:a,s:p.skill,speed:sp,ally:i,dice:[adie]});continue}
    const t=p.target&&p.target.hp>0?p.target:null;if(!t)continue;
    const mine=edice.filter(x=>x.u===t&&!claimed.has(x.key)&&x.d.skill.type!=='guard');
    let opp=mine.find(x=>x.d.target===a),redirect=false;
    if(!opp){opp=mine.filter(x=>x.d.speed<sp).sort((x,y)=>y.d.speed-x.d.speed)[0];redirect=!!opp}
    if(opp){claimed.add(opp.key);engs.push({kind:'clash',a:{u:a,s:p.skill},b:{u:t,s:opp.d.skill},speed:Math.max(sp,opp.d.speed),ally:i,redirect,edie:opp.d,dice:[adie,opp.d]})}
    else engs.push({kind:'one',u:a,s:p.skill,t,speed:sp,ally:i,dice:[adie]});
  }
  for(const x of edice){
    if(claimed.has(x.key))continue;
    if(x.d.skill.type==='guard')engs.push({kind:'guard',u:x.u,s:x.d.skill,speed:x.d.speed,dice:[x.d]});
    else engs.push({kind:'one',u:x.u,s:x.d.skill,t:x.d.target,speed:x.d.speed,dice:[x.d],edie:x.d});
  }
  return engs;
}
function rollTotal(u,s,coins){
  let t=s.base+powMod(u);const flips=[],p=headsP(u),para=u.st.paralysis||0;
  for(let i=0;i<coins;i++){const h=Math.random()<p;flips.push(h);if(h&&i>=para)t+=s.coinPow}
  return{total:Math.max(0,t),flips};
}
function clashOdds(A,sA,D,sD,N=300){
  let w=0;
  for(let n=0;n<N;n++){let ca=sA.coins,cd=sD.coins,ties=0;
    while(ca>0&&cd>0&&ties<4){const ra=rollTotal(A,sA,ca).total,rd=rollTotal(D,sD,cd).total;if(ra>rd)cd--;else if(rd>ra)ca--;else ties++}
    if(ca>0&&cd===0)w++}
  return w/N;
}

/* ---------- battle: resolution ---------- */
function applyTrig(trig,u,s,t){for(const f of s.effects||[])if(f.trig===trig)applyFx(f,u,t)}
const fastest=u=>u&&canAct(u)&&u.dice.length?Math.max(...u.dice.map(d=>d.speed)):0;
function fireUse(u,s,t,ctx={}){
  applyTrig('use',u,s,t);
  if(u.hp>0&&u.hp<u.maxHp*.5)applyTrig('lowhp',u,s,t);
  if(u.sp>=15)applyTrig('highsp',u,s,t);
  if((s.effects||[]).some(f=>f.trig==='spend')&&u.st.charge>=3){u.st.charge-=3;pop(u,'-3 Charge','st-charge');applyTrig('spend',u,s,t)}
  if(s.type!=='guard'){
    if(ctx.unopposed)applyTrig('unopposed',u,s,t);
    if((ctx.speed||0)>(ctx.theirSpeed||0))applyTrig('faster',u,s,t);
  }
}
function applyFx(f,u,t){
  const E=effDef(f.eff),n=f.amt;if(!E)return;
  if(E.on==='target'){if(!t||t.hp<=0||t===u)return}else if(u.hp<=0)return;
  const r=E.on==='target'?t:u;
  if(E.cs){const d=save.statuses[E.cs];r.cs[E.cs]=Math.min(10,(r.cs[E.cs]||0)+n);pop(r,`+${n} ${d.name}`,'cs',d.color);log(`${r.name} gains ${n} ${d.name}.`);return}
  if(E.st){addStatus(r,E.st,n,E.mode);pop(r,`+${n} ${E.label}`,'st-'+E.st);log(`${r.name} gains ${n} ${E.label}.`);return}
  switch(f.eff){
    case 'burst':for(let i=0;i<n;i++)tremorBurst(t);return;
    case 'shield':u.shield+=n*3;pop(u,`+${n*3} Shield`,'shield');break;
    case 'heal':{const h=Math.min(u.maxHp-u.hp,n*2);u.hp+=h;pop(u,`+${h} HP`,'heal');break}
    case 'sanity':changeSP(u,n*2);pop(u,`+${n*2} SP`,'sp');break;
    case 'rally':alive(u.side==='ally'?B.allies:B.enemies).forEach(x=>{changeSP(x,n*2);pop(x,`+${n*2} SP`,'sp')});break;
    case 'recoil':rawDamage(u,n*2,'Recoil','st-recoil');return;
    case 'strain':changeSP(u,-n*3);pop(u,`-${n*3} SP`,'st-sinking');break;

}
function afterDamage(u,killer){
  if(u.hp<=0){if(!u.dead){u.dead=true;onDeath(u,killer)}return}
  let trig=false;while(u.staggerHP.length&&u.hp<=u.staggerHP[0]){u.staggerSpent.push(u.staggerHP.shift());trig=true}
  if(trig&&!u.stag){u.stag=true;u.stagUntil=B.turn+1;pop(u,'STAGGERED','stag');log(`${u.name} is staggered: no actions next turn, double damage taken.`,'stag')}
}
function onDeath(u,killer){
  u.stag=false;u.dice.forEach(d=>d.done=true);
  log(`${u.name} goes down.`,'death');setPose(u,'down');
  if(u.side==='enemy'){alive(B.allies).forEach(a=>changeSP(a,5));if(killer&&killer.side==='ally')firePassive(killer,'kill')}
  else alive(B.allies).forEach(a=>{changeSP(a,-10);firePassive(a,'allyDown')});
}
function rawDamage(u,n,label,cls='',color){
  if(u.hp<=0||n<=0)return;u.hp=Math.max(0,u.hp-n);pop(u,`-${n} ${label}`,cls,color);log(`${u.name} takes ${n} from ${label}.`);afterDamage(u);
}
function dealHit(u,t,power,type){
  const mult=t.res?.[type]??1;
  const taken=Math.max(.1,1+.1*(t.st.fragile||0)-.1*(t.st.protection||0)+csWhile(t,'dmgTaken'));
  let dmg=power*mult*(t.stag?2:1)*taken,crit=false;
  if(u.st.poise>0&&Math.random()<Math.min(1,u.st.poise*.05)){crit=true;dmg*=1.2;spendCount(u,'poise')}
  dmg=Math.round(dmg);
  let rup=0;if(t.st.rupture>0){rup=t.st.rupture;dmg+=rup;spendCount(t,'rupture')}
  let blocked=0;if(t.shield>0){blocked=Math.min(t.shield,dmg);t.shield-=blocked;dmg-=blocked}
  t.hp=Math.max(0,t.hp-dmg);
  pop(t,`${crit?'CRIT ':''}-${dmg}${blocked?` (${blocked} blocked)`:''}`,crit?'crit':'dmg');
  log(`${u.name} hits ${t.name} for ${dmg}${crit?' (crit)':''}${rup?` incl. ${rup} Rupture`:''}${blocked?`, ${blocked} blocked`:''}${mult>1?' (weak)':mult<1?' (resisted)':''}.`,'dmg');
  if(t.hp>0&&t.st.sinking>0){const p=t.st.sinking;if(t.sp<=-45){t.hp=Math.max(0,t.hp-p);pop(t,`-${p} Gloom`,'st-sinking')}else{changeSP(t,-p);pop(t,`-${p} SP`,'st-sinking')}spendCount(t,'sinking')}
  if(t.hp>0)fireCS(t,'hit');

}
async function hitSequence(u,s,coins,t,atkId,defId){
  let power=s.base+powMod(u),dealt=0,landed=0,killed=false;const flips=[];
  setSide(atkId,{total:s.coins,remaining:coins,flips:[],val:Math.max(0,power),note:'Striking'});
  setSide(defId,{val:'',note:''});
  await sleep(260);
  for(let i=0;i<coins;i++){
    if(!canAct(u)||t.hp<=0)break;
    if(u.st.bleed>0){const b=u.st.bleed;spendCount(u,'bleed');rawDamage(u,b,'Bleed','st-bleed');renderUnits();if(!canAct(u))break}
    fireCS(u,'attack');if(!canAct(u))break;
    const wasStag=t.stag,afflicted=isAfflicted(t);
    const h=Math.random()<headsP(u);flips.push(h);
    let para=false;if(u.st.paralysis>0){u.st.paralysis--;para=true}
    if(h&&!para)power+=s.coinPow;
    const p=Math.max(0,power);
    setSide(atkId,{total:s.coins,remaining:coins,flips,val:p,anim:'last',note:para?'Paralyzed coin':'Striking'});
    setPose(u,'attack',true);
    applyTrig(h?'heads':'tails',u,s,t);
    const r=dealHit(u,t,p,s.type);dealt+=r.dmg;landed++;
    setPose(t,t.hp<=0?'down':'hit',true);
    if(landed===1)firePassive(t,'hit',{attacker:u});
    applyTrig('hit',u,s,t);
    if(landed===1)applyTrig('first',u,s,t);
    if(i===coins-1)applyTrig('final',u,s,t);
    if(r.crit)applyTrig('crit',u,s,t);
    if(wasStag)applyTrig('stagtarget',u,s,t);
    if(afflicted)applyTrig('afflicted',u,s,t);
    if(t.hp<=0&&!killed){killed=true;applyTrig('kill',u,s,t)}
    setSide(defId,{val:`-${dealt}`,cls:'dmg',note:t.hp<=0?'Down':t.stag?'Staggered':''});
    renderUnits();
    await sleep(480);
  }
  if(!t._busy)basePose(t);
  await sleep(200);
}
async function resolveClash(e){
  const A=e.a.u,sA=e.a.s,D=e.b.u,sD=e.b.s;
  A._busy=D._busy=true;
  moveTo(A,A.side==='ally'?43:57,4);moveTo(D,D.side==='ally'?43:57,4);setPose(A,'ready');setPose(D,'ready');
  stageSides(A,sA,D,sD);
  log(`${A.name} (${sA.name}) clashes with ${D.name} (${sD.name}).`);
  const spA=e.dice[0].speed,spD=e.dice[1].speed;
  fireUse(A,sA,D,{speed:spA,theirSpeed:spD});fireUse(D,sD,A,{speed:spD,theirSpeed:spA});renderUnits();
  await sleep(460);
  let ca=sA.coins,cd=sD.coins,ties=0,round=0;
  while(ca>0&&cd>0&&ties<4){
    round++;
    const ra=rollTotal(A,sA,ca),rd=rollTotal(D,sD,cd);
    $('#cvs').textContent=`Clash ${round}`;
    setSide('csA',{total:sA.coins,remaining:ca,flips:ra.flips,val:ra.total});
    setSide('csB',{total:sD.coins,remaining:cd,flips:rd.flips,val:rd.total});
    setPose(A,'attack',true);setPose(D,'attack',true);
    await sleep(700);
    if(ra.total>rd.total){cd--;setSide('csB',{total:sD.coins,remaining:cd,note:'Coin broken'});setSide('csA',{note:''});setPose(D,'hit',true);setPose(A,'ready')}
    else if(rd.total>ra.total){ca--;setSide('csA',{total:sA.coins,remaining:ca,note:'Coin broken'});setSide('csB',{note:''});setPose(A,'hit',true);setPose(D,'ready')}
    else{ties++;setSide('csA',{note:'Tie'});setSide('csB',{note:'Tie'});setPose(A,'ready');setPose(D,'ready')}
    await sleep(380);
  }
  if(ca>0&&cd>0){log('Stalemate. Both skills are spent.');await sleep(300);goHome(A);goHome(D);return}
  const aWon=ca>0;
  const W=aWon?A:D,Lo=aWon?D:A,sW=aWon?sA:sD,sL=aWon?sD:sA,left=aWon?ca:cd;
  const wId=aWon?'csA':'csB',lId=aWon?'csB':'csA';
  document.getElementById(wId).classList.add('won');document.getElementById(lId).classList.add('lost');
  changeSP(W,Math.min(6,2+round));changeSP(Lo,-1);
  pop(W,'Clash won','win');setPose(W,'ready');setPose(Lo,'hit');
  log(`${W.name} wins the clash in ${round} round${round>1?'s':''}.`);
  applyTrig('win',W,sW,Lo);applyTrig('lose',Lo,sL,W);
  fireCS(W,'win');fireCS(Lo,'lose');firePassive(W,'win');firePassive(Lo,'lose');
  renderUnits();
  await sleep(300);
  await hitSequence(W,sW,left,Lo,wId,lId);
  goHome(A);goHome(D);await sleep(260);
}
async function resolveOne(u,s,t,speed=0){
  u._busy=true;
  const h=home(t);moveTo(u,h.x+(u.side==='ally'?-10:10),h.b);setPose(u,'ready');
  stageSides(u,s,t,null);
  log(`${u.name} uses ${s.name} on ${t.name}, unopposed.`);
  fireUse(u,s,t,{unopposed:true,speed,theirSpeed:fastest(t)});renderUnits();
  await sleep(420);
  await hitSequence(u,s,s.coins,t,'csA','csB');
  goHome(u);await sleep(260);
}
async function resolveGuard(e){
  const u=e.u,s=e.s;if(!canAct(u))return;
  u._busy=true;setPose(u,'guard');
  const r=rollTotal(u,s,s.coins);
  u.shield+=r.total;
  $('#hud').innerHTML=`<div class="clash"><div class="cs" id="csA"><div class="cs-name">${esc(u.name)}</div><div class="cs-skill t-guard">${esc(s.name)}</div><div class="cs-coins" data-coins></div><div class="cs-total" data-total></div><div class="cs-note" data-note>Shield raised</div></div><div class="cvs">Guard</div><div class="cs"></div></div>`;
  setSide('csA',{total:s.coins,remaining:s.coins,flips:r.flips,val:`+${r.total}`});
  pop(u,`+${r.total} Shield`,'shield');log(`${u.name} braces with ${s.name}: +${r.total} Shield.`);

function checkOver(){if(!alive(B.enemies).length)return'win';if(!alive(B.allies).length)return'lose';return null}
async function executeTurn(){
  if(!B||B.phase!=='plan')return;
  B.plans.forEach(p=>{if(p&&p.skill&&p.skill.type!=='guard'&&!(p.target&&p.target.hp>0))p.target=randomAlive(B.enemies)});
  const engs=computeEngagements();
  B.engs=engs;B.phase='resolve';B.active=null;renderBattle();
  const guards=engs.filter(e=>e.kind==='guard');
  const rest=engs.filter(e=>e.kind!=='guard').sort((x,y)=>y.speed-x.speed||((y.ally!=null)-(x.ally!=null)));
  for(const e of [...guards,...rest]){
    if(checkOver())break;
    if(e.kind==='guard')await resolveGuard(e);
    else if(e.kind==='clash'){
      const A=e.a.u,D=e.b.u,aOk=canAct(A),dOk=canAct(D);
      if(aOk&&dOk)await resolveClash(e);
      else if(aOk){const t=D.hp>0?D:randomAlive(B.enemies);if(t)await resolveOne(A,e.a.s,t,e.dice[0].speed)}
      else if(dOk){const t=A.hp>0?A:randomAlive(B.allies);if(t)await resolveOne(D,e.b.s,t,e.dice[1].speed)}
    }else if(canAct(e.u)){
      const t=e.t.hp>0?e.t:randomAlive(e.u.side==='ally'?B.enemies:B.allies);
      if(t)await resolveOne(e.u,e.s,t,e.speed);
    }
    e.dice.forEach(d=>d.done=true);renderUnits();
  }
  if(!checkOver())await endOfTurn();
  const o=checkOver();
  if(o){finishBattle(o==='win');return}
  B.turn++;startTurn();
}
async function endOfTurn(){
  let any=false;const all=[...B.allies,...B.enemies];
  for(const u of all){
    if(u.hp<=0)continue;
    if(u.st.burn>0){const n=u.st.burn;spendCount(u,'burn');rawDamage(u,n,'Burn','st-burn');any=true}
    if(u.hp>0&&u.st.tremor>0)spendCount(u,'tremor');
    if(u.hp>0&&Object.keys(u.cs).some(id=>u.cs[id]>0&&save.statuses[id]&&save.statuses[id].trig==='turnEnd')){fireCS(u,'turnEnd');any=true}
  }
  for(const u of all){
    u.shield=0;
    for(const k of Object.keys(u.exp)){if(B.turn>=u.exp[k]){u.st[k]=0;delete u.exp[k]}}
    for(const id in u.cs){const d=save.statuses[id];if(!d)continue;if(d.decay==='endOne')u.cs[id]=Math.max(0,u.cs[id]-1);else if(d.decay==='endAll')u.cs[id]=0}
    if(u.stag&&u.hp>0&&B.turn>=u.stagUntil){u.stag=false;pop(u,'Recovered','win');log(`${u.name} recovers from stagger.`)}
  }
  B.allies.forEach(a=>{if(a.passives.some(p=>p.trig==='turnEnd'||p.trig==='lowhp'))any=true;firePassive(a,'turnEnd');firePassive(a,'lowhp')});
  renderUnits();
  if(any){$('#hud').innerHTML='<div class="hud-idle"><span class="eyebrow">End of turn</span><b>Afflictions &amp; passives</b></div>';await sleep(700)}
}
function finishBattle(win){
  const rewards={};let first=false,hours=0;
  if(win){
    let base;
    if(B.night){base=3+save.streak;save.streak++;save.best=Math.max(save.best,save.streak)}
    else{const st=STAGES[B.stage];first=!save.cleared[st.id];base=first?st.reward:Math.ceil(st.reward/3);save.cleared[st.id]=true}
    B.allies.forEach(a=>{const n=a.hp>0?base:Math.ceil(base/2);rewards[a.key]=n;save.tokens[a.key]+=n});
    save.wins++;
  }else if(B.night){hours=save.streak;save.streak=0}
  persist();
  B.over={win,rewards,first,hours};B.phase='over';
  $('#hud').innerHTML=`<div class="hud-idle"><span class="eyebrow">${win?'All opposition down':'Squad defeated'}</span><b>${win?'Paid':'Failed'}</b></div>`;
  (win?B.allies:B.enemies).forEach(u=>{if(u.hp>0)setPose(u,'ready')});
  renderHeader();renderBattle();
  $('#planner').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function pickSkill(i,k){
  if(!B||B.phase!=='plan')return;
  const p=B.plans[i];if(!p)return;const s=p.hand[k];p.skill=s;
  if(s.type==='guard'){p.target=null;B.active=null}else{B.active=i;if(!p.target||p.target.hp<=0)p.target=null}
  renderBattle();
}
function setTarget(ei){
  if(!B||B.phase!=='plan')return;
  const en=B.enemies[ei];if(!en||en.hp<=0)return;
  if(B.active==null){toast('Tap a skill first, then the enemy.');return}
  const p=B.plans[B.active];if(p.skill.type==='guard')p.skill=p.hand.find(s=>s.type!=='guard')||p.skill;
  p.target=en;B.active=null;renderBattle();
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}
function armed(btn,label,ms=3000){if(btn.dataset.armed)return true;btn.dataset.armed='1';const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},ms);return false}
function rerenderKeepFocus(id){render();const el=id&&document.getElementById(id);if(el)el.focus()}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act,d=t.dataset;
  switch(a){
    case 'go':if(view!=='battle')go(d.v);break;
    case 'start':startBattle(+d.stage);break;
    case 'night':case 'nextnight':startBattle('night');break;
    case 'field':toggleTeam(d.c);break;
    case 'forgefor':forge.char=d.c;forge.pending=null;go('forge');break;
    case 'dressfor':wardrobe.char=d.c;go('wardrobe');break;
    case 'fchar':forge.char=d.c;forge.pending=forge.pendingCs=forge.pendingP=null;render();break;
    case 'ftab':forge.tab=d.v;render();break;
    // skills

    case 'addfx':if(draft.effects.length<4){draft.effects.push(draft.type==='guard'?{trig:'use',eff:'sanity',amt:1}:{trig:'hit',eff:CHARS[forge.char].sig,amt:1});normalizeDraft();renderFxList();updateForgePreview()}break;

    case 'fxamt':{const f=draft.effects[+d.fx];f.amt=clamp(f.amt+(+d.d),1,effDef(f.eff).max);renderFxList();updateForgePreview();const again=document.querySelector(`[data-act="fxamt"][data-fx="${d.fx}"][data-d="${d.d}"]`);if(again&&!again.disabled)again.focus();break}

    case 'cscreate':createStatus();break;

    case 'pamt':pDraft.amt=clamp(pDraft.amt+(+d.d),1,P_EFF[pDraft.eff].max);render();break;
    case 'pcreate':createPassive();break;
    case 'pequip':togglePassive(d.id);break;
    case 'pdel':deletePassive(d.id);break;
    // wardrobe
    case 'wchar':wardrobe.char=d.c;render();break;
    case 'wsec':wardrobe.sec=d.v;render();break;
    case 'wopt':setLook(d.k,d.v);render();break;
    case 'wsw':setLook(d.k,d.c);render();break;
    case 'wpose':wardrobe.pose=d.v;{const dl=$('#wdDoll');if(dl){dl.className='doll';void dl.offsetWidth;dl.className='doll pose-'+d.v+(d.v==='idle'?' idle':'')}}document.querySelectorAll('[data-act="wpose"]').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));break;
    case 'wrand':randomLook();render();break;

    // battle
    case 'pick':pickSkill(+d.a,+d.k);break;

    case 'aim':if(B&&B.phase==='plan'&&B.plans[+d.a]){const p=B.plans[+d.a];if(p.skill&&p.skill.type!=='guard'){B.active=B.active===+d.a?null:+d.a;renderBattle()}}break;
